name: Publiceer site

on:
  push:
    branches: [main]
    paths: ["bron/**", "scripts/**", "overrides/**", "docs/js/**", "docs/css/**", "mkdocs.base.yml", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Installeer pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: pip install -r requirements.txt
      - name: Zet publieksversie om
        run: python scripts/build_site.py
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
