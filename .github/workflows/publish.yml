name: Publiceer site

on:
  push:
    branches: [main]
    paths: ["bron/**", "scripts/**", "overrides/**", "docs/js/**", "docs/css/**", "mkdocs.base.yml", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      klaar: ${{ steps.bron.outputs.klaar }}
    steps:
      - uses: actions/checkout@v4
      - id: bron
        name: Controleer of er een publieksversie in bron/ staat
        run: |
          if ls bron/*publiek*.docx >/dev/null 2>&1 && ls bron/*publiek*.xlsx >/dev/null 2>&1; then
            echo "klaar=true" >> "$GITHUB_OUTPUT"
          else
            echo "klaar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nog geen publieksversie (docx en xlsx met 'publiek' in de naam) in bron/; site niet gebouwd."
          fi
  build:
    needs: check
    if: needs.check.outputs.klaar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Installeer pandoc
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-1-amd64.deb
          sudo dpkg -i pandoc-3.1.11-1-amd64.deb
          pandoc --version | head -1
      - run: pip install -r requirements.txt
      - name: Zet publieksversie om
        run: python scripts/build_site.py
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
